<!DOCTYPE html>
<html lang="az" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120e24" />
    <style>
      html, body { background: #020617; }
    </style>
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('exampulse_theme_choice');
          var dark = choice !== 'light';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/app-icon-1024.png" />
    <title>ExamPulse – İmtahan platforması</title>
    <meta name="description" content="Müəllim imtahanı yaradır, şagird həll edir, ExamPulse isə hansı mövzuda güclü, hansında zəif olduğunu göstərir." />
    <meta property="og:title" content="ExamPulse – İmtahan platforması" />
    <meta property="og:description" content="Müəllim imtahanı yaradır, şagird həll edir, ExamPulse isə hansı mövzuda güclü, hansında zəif olduğunu göstərir." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="az_AZ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
